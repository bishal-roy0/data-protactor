services:
  - type: web
    name: sentinel-ai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn sentinel_ai.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: PYTHONPATH
        value: src
